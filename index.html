<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اجتماع شباب الأنبا صرابامون - تقييم الفرق</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- الخطوط العربية (Cairo & Amiri) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                    },
                    colors: {
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155',
                        lightbg: '#f1f5f9',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .hidden-app { display: none !important; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        .glass-nav {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .dark .glass-nav {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid rgba(51, 65, 85, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        @keyframes floatPulse {
            0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 10px 20px rgba(59, 130, 246, 0.4)); }
            50% { transform: scale(1.08) translateY(-10px); filter: drop-shadow(0 25px 30px rgba(59, 130, 246, 0.7)); }
        }
        @keyframes orbitRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .logo-loader { animation: floatPulse 2.5s ease-in-out infinite; }
        .orbit-ring { animation: orbitRotate 3.5s linear infinite; }

        /* إطارات المراكز التنافسية (ذهبي، فضي، برونزي) */
        .gold-card {
            border: 2px solid #f59e0b;
            background: linear-gradient(135deg, rgba(254, 243, 199, 0.8) 0%, rgba(255, 255, 255, 0.95) 100%);
            box-shadow: 0 10px 30px -5px rgba(245, 158, 11, 0.3);
        }
        .dark .gold-card {
            background: linear-gradient(135deg, rgba(120, 53, 15, 0.4) 0%, rgba(30, 41, 59, 0.95) 100%);
        }

        .silver-card {
            border: 2px solid #94a3b8;
            background: linear-gradient(135deg, rgba(241, 245, 249, 0.8) 0%, rgba(255, 255, 255, 0.95) 100%);

        }
        .dark .silver-card {
            background: linear-gradient(135deg, rgba(51, 65, 85, 0.4) 0%, rgba(30, 41, 59, 0.95) 100%);

            border: 2px solid #d97706;

    </style>
</head>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzhqQA_gWRiYmO5iSISTXgvaPO92Mrxvg7-s_UVe6I4PaJKUdxDEIhzgAEMiEUPTz4Ggg/exec";

        let CONFIG = {
            PASSWORD: "",
            MEETING_NAME: "اجتماع شباب الأنبا صرابامون",
            LOGO_IMAGE: "logo.png",
            ALERT: ""
        };

        let teamsData = [];        
        let rankingData = [];      
        let teamSheetsData = {};   
        let activeTeam = null;
        let selectedDate = null;
        let autoRefreshTimer = null;
        let isAuthenticated = false;

        // دالة معالجة مسار الصورة ذكياً لضمان قراءة الصورة المحلية أو الروابط المباشرة
        function processDriveUrl(url) {
            if (!url) return "logo.png";
            const str = String(url).trim();
            
            // روابط Google Drive
            const match = str.match(/\/file\/d\/([^\/\?]+)/) || str.match(/id=([^&]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }

            // الروابط المباشرة (http/https)
            if (str.startsWith('http://') || str.startsWith('https://')) {
                return str;
            }

            // اسم ملف صورة محلي: إذا لم يحتوي على امتداد، نضيف .png
            if (!/\.(png|jpg|jpeg|svg|webp|gif)$/i.test(str)) {
                return `${str}.png`;
            }

            return str;
        }

        // دالة المعالجة الذكية في حالة عدم العثور على الصورة المحددة
        function handleImageError(imgElem) {
            if (!imgElem) return;
            
            if (!imgElem.dataset.errorCount) {
                imgElem.dataset.errorCount = "1";
                imgElem.src = "logo.png";
            } else if (imgElem.dataset.errorCount === "1") {
                imgElem.dataset.errorCount = "2";
                imgElem.src = "logo.jpg";
            } else {
                imgElem.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0iIzNCODJGNiIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjIwIiBmaWxsPSIjRkZGIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7YtNio2KfYqDwvdGV4dD48L3N2Zz4=';
            }
        }

        function formatPercentValue(rawVal) {
            if (rawVal === undefined || rawVal === null || rawVal === "") return "100%";
            let str = String(rawVal).trim();
            if (str.endsWith('%')) {
                let num = parseFloat(str.replace('%', ''));
                return isNaN(num) ? str : num.toFixed(1) + '%';
            }
            let num = parseFloat(str);
            if (isNaN(num)) return str;
            if (num <= 1 && num > 0) num = num * 100;
            return num.toFixed(1) + '%';
        }

        // جلب البيانات من شيت جوجل مع منع التخزين المؤقت (Cache Buster)
        async function fetchSheetData(isManualTrigger = false, isSilent = false) {
            const overlay = document.getElementById('loadingOverlay');
            const retryBtn = document.getElementById('retryBtn');

            // إظهار شاشة التحميل فقط إذا لم يكن التحديث صامتاً بالخلفية
            if (!isSilent) {
                overlay.classList.remove('hidden', 'opacity-0');
                retryBtn.classList.add('hidden');
            }

            try {
                // إضافة timestamp لمنع المتصفح من استخدام البيانات المخبأة (Cache Eraser)
                const fetchUrl = `${API_URL}${API_URL.includes('?') ? '&' : '?'}_t=${Date.now()}`;
                const response = await fetch(fetchUrl, { 
                    method: 'GET',
                    redirect: 'follow',
                    cache: 'no-store'
                });

                if (!response.ok) throw new Error(`HTTP Status ${response.status}`);
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                if (data.settings) {
                    const s = data.settings;
                    CONFIG.PASSWORD = s.Password || s.PASSWORD || CONFIG.PASSWORD;
                    CONFIG.MEETING_NAME = s.MeetingName || s.MEETING_NAME || CONFIG.MEETING_NAME;
                    CONFIG.LOGO_IMAGE = processDriveUrl(s.LogoURL || s.LOGO_IMAGE || CONFIG.LOGO_IMAGE);
                    CONFIG.ALERT = s.Alert || s.ALERT || "";
                }

                teamsData = data.teams || [];
                rankingData = data.ranking || [];
                teamSheetsData = data.teamSheets || {};

                renderUI();
                
                // الحفاظ على كلمات البحث الحالية حتى لا تنقطع تجربة المستخدم عند التحديث الصامت
                const searchTeamsVal = document.getElementById('searchTeamsInput')?.value || "";
                renderTeamsView(searchTeamsVal);
                renderRankingView();

                // إذا كان المستخدم يتابع تيم معين، نقوم بتحديث نسبة التيم وقائمة الأعضاء فوراً
                if (activeTeam && teamSheetsData[activeTeam]) {
                    const sheetInfo = teamSheetsData[activeTeam];
                    const percentElem = document.getElementById('detailTeamTotalPercent');
                    if (percentElem) percentElem.innerText = formatPercentValue(sheetInfo.teamTotalPercent);
                    
                    // تحديث القائمة المنسدلة للتواريخ مع الاحتفاظ بالتاريخ المختار
                    const selector = document.getElementById('dateSelector');
                    if (selector && sheetInfo.dates && sheetInfo.dates.length > 0) {
                        const currentVal = selector.value || selectedDate;
                        selector.innerHTML = '';
                        sheetInfo.dates.forEach(d => {
                            const opt = document.createElement('option');
                            opt.value = d;
                            opt.innerText = d;
                            if (d === currentVal) opt.selected = true;
                            selector.appendChild(opt);
                        });
                        selectedDate = selector.value || sheetInfo.dates[0];
                    }

                    const searchMembersVal = document.getElementById('searchMembersInput')?.value || "";
                    if (selectedDate) renderMembersForDate(selectedDate, searchMembersVal);
                }

                if (!isSilent) {
                    overlay.classList.add('opacity-0');
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                    }, 500);
                }

                if (isManualTrigger) {
                    showToast("تم تحديث البيانات بنجاح 🔄");
                }

            } catch (error) {
                console.error("خطأ أثناء جلب البيانات:", error);
                if (!isSilent) {
                    retryBtn.classList.remove('hidden');
                    overlay.classList.remove('opacity-0');
                }
            }
        }

        function checkPassword(e) {
            e.preventDefault();
            const input = document.getElementById('passwordInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loginScreen = document.getElementById('loginScreen');

            if (input === String(CONFIG.PASSWORD).trim()) {
                isAuthenticated = true;
                loginScreen.style.opacity = '0';
                setTimeout(() => {
                    loginScreen.classList.add('hidden');
                    loginScreen.style.opacity = '1';
                }, 500);
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function renderUI() {
            if (CONFIG.MEETING_NAME) {
                document.title = CONFIG.MEETING_NAME;
                document.querySelectorAll('.meeting-name-display').forEach(el => el.innerText = CONFIG.MEETING_NAME);
            }
            
            if (CONFIG.LOGO_IMAGE) {
                document.querySelectorAll('.logo-display').forEach(el => {
                    if (!el.src || el.src !== CONFIG.LOGO_IMAGE) el.src = CONFIG.LOGO_IMAGE;
                });
            }
            
            const alertBanner = document.getElementById('alertBanner');
            const alertText = document.getElementById('alertText');
            if (CONFIG.ALERT && CONFIG.ALERT.trim() !== "") {
                alertText.innerText = CONFIG.ALERT;
                alertBanner.classList.remove('hidden');
            } else {
                alertBanner.classList.add('hidden');
            }

            const loginScreen = document.getElementById('loginScreen');
            if (!isAuthenticated && CONFIG.PASSWORD && CONFIG.PASSWORD.trim() !== "") {
                loginScreen.classList.remove('hidden');
            } else {
                loginScreen.classList.add('hidden');
            }
        }

        function switchTab(tab) {
            const vTeams = document.getElementById('viewTeams');
            const vRanking = document.getElementById('viewRanking');
            const vDetails = document.getElementById('viewTeamDetails');
            
            const btnTeams = document.getElementById('tabBtnTeams');
            const btnRanking = document.getElementById('tabBtnRanking');

            vDetails.classList.add('hidden-app');

            if (tab === 'teams') {
                vTeams.classList.remove('hidden-app');
                vRanking.classList.add('hidden-app');
                
                btnTeams.className = "flex-1 max-w-[200px] py-2.5 px-6 rounded-2xl font-black text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 bg-white dark:bg-darkcard text-blue-600 dark:text-blue-400 border-2 border-blue-500 shadow-lg scale-105";
                btnRanking.className = "flex-1 max-w-[200px] py-2.5 px-6 rounded-2xl font-black text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 hover:border-blue-400";
            } else {
                vTeams.classList.add('hidden-app');
                vRanking.classList.remove('hidden-app');

                btnRanking.className = "flex-1 max-w-[200px] py-2.5 px-6 rounded-2xl font-black text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 bg-white dark:bg-darkcard text-blue-600 dark:text-blue-400 border-2 border-blue-500 shadow-lg scale-105";
                btnTeams.className = "flex-1 max-w-[200px] py-2.5 px-6 rounded-2xl font-black text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700 hover:border-blue-400";
            }
        }

        function renderTeamsView(filterQuery = "") {
            const grid = document.getElementById('teamsCardsGrid');
            grid.innerHTML = '';

            const q = filterQuery.trim().toLowerCase();

            teamsData.forEach(team => {
                if (q && !team.name.toLowerCase().includes(q)) return;

                const sheetObj = teamSheetsData[team.name];
                const rawPercent = sheetObj ? sheetObj.teamTotalPercent : team.totalPercent;
                const formattedPercent = formatPercentValue(rawPercent);
                const logoSrc = processDriveUrl(team.logo);
                
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-darkcard p-4 md:p-5 rounded-3xl border border-slate-200 dark:border-darkborder hover:border-blue-500 dark:hover:border-blue-400 shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer flex flex-col items-center justify-center text-center group relative overflow-hidden";
                card.onclick = () => openTeamDetails(team.name);

                card.innerHTML = `
                    <div class="w-36 h-36 md:w-44 md:h-44 rounded-3xl bg-slate-50 dark:bg-slate-800/80 p-3 flex items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm group-hover:scale-105 transition-transform duration-300 mb-3">
                        <img src="${logoSrc || ''}" alt="Ava-Srabamon Youth Meeting Logo" class="w-full h-full object-contain rounded-2xl"
                        onerror="handleImageError(this)">
                    </div>
                    
                    <h3 class="text-base md:text-lg font-black text-slate-800 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors mb-1.5 leading-tight">${team.name}</h3>
                    
                    <div class="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800/50 px-4 py-1.5 rounded-xl">
                        <span class="text-[9px] font-extrabold text-slate-500 dark:text-slate-400 block mb-0.5">النسبة الكلية</span>
                        <span class="font-black text-sm md:text-base text-blue-600 dark:text-blue-400">${formattedPercent}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterTeams(val) {
            renderTeamsView(val);
        }

        function renderRankingView() {
            const grid = document.getElementById('rankingCardsGrid');
            grid.innerHTML = '';

            let allTeamsToRank = [...teamsData];

            if (rankingData && rankingData.length > 0) {
                rankingData.forEach(r => {
                    let found = allTeamsToRank.find(t => t.name === r.name);
                    if (found && r.logo) found.logo = processDriveUrl(r.logo);
                    if (!found) allTeamsToRank.push(r);
                });
            }

            let sortedRanking = allTeamsToRank.map(item => {
                const sheetObj = teamSheetsData[item.name];
                const rawPercent = sheetObj ? sheetObj.teamTotalPercent : item.totalPercent;
                const cleanVal = isNaN(parseFloat(String(rawPercent).replace('%', ''))) ? 0 : parseFloat(String(rawPercent).replace('%', ''));
                return {
                    ...item,
                    calcPercent: cleanVal,
                    displayPercent: formatPercentValue(rawPercent),
                    logo: processDriveUrl(item.logo)
                };
            }).sort((a, b) => b.calcPercent - a.calcPercent);

            const rankTitles = ['الأول 🥇', 'الثاني 🥈', 'الثالث 🥉', 'الرابع 🏅', 'الخامس 🏅', 'السادس 🏅', 'السابع 🏅', 'الثامن 🏅'];
            const frameClasses = ['gold-card', 'silver-card', 'bronze-card'];

            sortedRanking.forEach((item, index) => {
                const rankTitle = rankTitles[index] || `المركز ${index + 1}`;
                const frameClass = frameClasses[index] || 'bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder';

                const card = document.createElement('div');
                card.className = `${frameClass} p-4 md:p-5 rounded-3xl shadow-sm transition-all duration-300 flex flex-col items-center justify-center text-center group relative overflow-hidden`;

                card.innerHTML = `
                    <div class="absolute top-2.5 right-2.5 px-2.5 py-0.5 rounded-lg text-[11px] font-black ${index === 0 ? 'bg-amber-500 text-white' : index === 1 ? 'bg-slate-500 text-white' : index === 2 ? 'bg-amber-700 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300'}">
                        ${rankTitle}
                    </div>

                    <div class="w-36 h-36 md:w-44 md:h-44 rounded-3xl bg-white/90 dark:bg-slate-800/90 p-3 flex items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm mt-3 mb-2.5">
                        <img src="${item.logo || ''}" alt="Ava-Srabamon Youth Meeting Logo" class="w-full h-full object-contain rounded-2xl"
                        onerror="handleImageError(this)">
                    </div>
                    
                    <h3 class="text-base md:text-lg font-black text-slate-900 dark:text-white mb-1.5 leading-tight">${item.name}</h3>
                    
                    <div class="bg-white/90 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-700 px-4 py-1.5 rounded-xl shadow-sm">
                        <span class="text-[9px] font-extrabold text-slate-500 dark:text-slate-400 block mb-0.5">النسبة الكلية</span>
                        <span class="font-black text-sm md:text-base text-emerald-600 dark:text-emerald-400">${item.displayPercent}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openTeamDetails(teamName) {
            activeTeam = teamName;
            const teamObj = teamsData.find(t => t.name === teamName) || {};
            const sheetInfo = teamSheetsData[teamName] || { dates: [], members: [], teamTotalPercent: "100%" };

            document.getElementById('viewTeams').classList.add('hidden-app');
            document.getElementById('viewRanking').classList.add('hidden-app');
            document.getElementById('viewTeamDetails').classList.remove('hidden-app');

            document.getElementById('detailTeamName').innerText = teamName;
            document.getElementById('detailTeamLogo').src = processDriveUrl(teamObj.logo);
            document.getElementById('detailTeamTotalPercent').innerText = formatPercentValue(sheetInfo.teamTotalPercent);

            const selector = document.getElementById('dateSelector');
            selector.innerHTML = '';

            if (sheetInfo.dates && sheetInfo.dates.length > 0) {
                sheetInfo.dates.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    opt.innerText = d;
                    selector.appendChild(opt);
                });
                selectedDate = sheetInfo.dates[0];
            } else {
                selectedDate = null;
            }

            document.getElementById('searchMembersInput').value = '';
            renderMembersForDate(selectedDate);
        }

        function backToTeams() {
            document.getElementById('viewTeamDetails').classList.add('hidden-app');
            document.getElementById('viewTeams').classList.remove('hidden-app');
        }

        function onDateChanged(newDate) {
            selectedDate = newDate;
            const searchVal = document.getElementById('searchMembersInput').value;
            renderMembersForDate(selectedDate, searchVal);
        }

        function filterMembers(searchVal) {
            renderMembersForDate(selectedDate, searchVal);
        }

        function renderMembersForDate(dateStr, searchQuery = "") {
            const container = document.getElementById('membersAssessmentList');
            container.innerHTML = '';

            if (!activeTeam || !teamSheetsData[activeTeam] || !dateStr) {
                container.innerHTML = `<div class="text-center p-8 bg-white dark:bg-darkcard rounded-2xl text-slate-500 font-bold">لا توجد بيانات لهذا التاريخ.</div>`;
                return;
            }

            const sheetInfo = teamSheetsData[activeTeam];
            const q = searchQuery.trim().toLowerCase();

            sheetInfo.members.forEach((member, index) => {
                if (q && !member.name.toLowerCase().includes(q)) return;

                const currentScore = member.scores[dateStr] !== undefined ? member.scores[dateStr] : "";
                const formattedPercent = formatPercentValue(member.percent);

                const card = document.createElement('div');
                card.className = "bg-white dark:bg-darkcard p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-darkborder flex flex-col gap-3 transition-all";

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-800 pb-2.5">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 font-mono text-xs font-black w-6 h-6 rounded-lg flex items-center justify-center shrink-0">${index + 1}</span>
                            <h3 class="font-extrabold text-slate-800 dark:text-slate-100 text-sm md:text-base truncate">${member.name}</h3>
                        </div>

                        <div class="flex items-center gap-2 shrink-0">
                            <div class="bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-xl text-center">
                                <span class="text-[9px] text-slate-500 dark:text-slate-400 block font-bold">المجموع</span>
                                <span id="pts-${index}" class="font-black text-xs md:text-sm text-blue-600 dark:text-blue-400">${member.totalPoints || 0}</span>
                            </div>
                            <div class="bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800/50 px-2.5 py-1 rounded-xl text-center">
                                <span class="text-[9px] text-slate-500 dark:text-slate-400 block font-bold">النسبة</span>
                                <span id="pct-${index}" class="font-black text-xs md:text-sm text-emerald-600 dark:text-emerald-400">${formattedPercent}</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-4 gap-2 pt-1">
                        ${[15, 10, 5, 0].map(val => `
                            <button onclick="updateScore('${member.name}', '${dateStr}', ${val}, ${index})"
                                class="py-2 rounded-xl font-black text-xs md:text-sm transition-all shadow-sm active:scale-95 border ${String(currentScore) === String(val) 
                                    ? (val === 15 ? 'bg-emerald-600 text-white border-emerald-600 ring-2 ring-emerald-300' 
                                      : val === 10 ? 'bg-blue-600 text-white border-blue-600 ring-2 ring-blue-300'
                                      : val === 5 ? 'bg-amber-500 text-white border-amber-500 ring-2 ring-amber-300'
                                      : 'bg-rose-600 text-white border-rose-600 ring-2 ring-rose-300') 
                                    : 'bg-slate-50 dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800'}"
                            >
                                ${val}
                            </button>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function updateScore(memberName, dateStr, scoreValue, memberIndex) {
            showToast("جاري حفظ التقييم...");

            if (activeTeam && teamSheetsData[activeTeam]) {
                const sheetInfo = teamSheetsData[activeTeam];
                const member = sheetInfo.members[memberIndex];
                if (member) {
                    member.scores[dateStr] = scoreValue;
                    renderMembersForDate(dateStr, document.getElementById('searchMembersInput').value);
                }
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        action: 'updateScore',
                        teamName: activeTeam,
                        memberName: memberName,
                        date: dateStr,
                        score: scoreValue
                    })
                });
                
                const res = await response.json();
                if (res.success) {
                    showToast("تم الحفظ في الجوجل شيت ✨");
                    if (activeTeam && teamSheetsData[activeTeam]) {
                        const sheetInfo = teamSheetsData[activeTeam];
                        const member = sheetInfo.members[memberIndex];
                        if (member) {
                            if (res.totalPoints !== undefined) member.totalPoints = res.totalPoints;
                            if (res.percent !== undefined) member.percent = res.percent;
                            
                            const ptsElem = document.getElementById(`pts-${memberIndex}`);
                            const pctElem = document.getElementById(`pct-${memberIndex}`);
                            if (ptsElem) ptsElem.innerText = member.totalPoints;
                            if (pctElem) pctElem.innerText = formatPercentValue(member.percent);
                        }

                        if (res.teamTotalPercent !== undefined) {
                            sheetInfo.teamTotalPercent = res.teamTotalPercent;
                            document.getElementById('detailTeamTotalPercent').innerText = formatPercentValue(res.teamTotalPercent);
                        }
                    }
                    renderTeamsView(document.getElementById('searchTeamsInput').value);
                    renderRankingView();
                }
            } catch (err) {
                console.error("خطأ في تحديث التقييم:", err);
                showToast("تعذر الحفظ في الجوجل شيت");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2200);
        }

        function initTheme() {
            const btn = document.getElementById('themeToggleBtn');
            if (!btn) return;
            
            if (document.documentElement.classList.contains('dark')) {
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
            } else {
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
            }
            initTheme();
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            fetchSheetData(false, false); // تحميل أولي بشاشة الترحيب
            
            // تحديث تلقائي صامت ومباشر كل ثانيتين بدون أي تخزين مؤقت أو حجب واجهة
            autoRefreshTimer = setInterval(() => {
                if (document.visibilityState === 'visible') {
                    fetchSheetData(false, true); // تحديث صامت في الخلفية
                }
            }, 2000);
        });
    </script>
</body>
</html>
